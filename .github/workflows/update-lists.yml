name: Update Routing Lists

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh upstream lists and aggregate RU subnets
        run: |
          python3 - << 'PY'
          import ipaddress, pathlib, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'curl/8.7'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8')

          rules = pathlib.Path('rules')
          for fn in ('domains_banking.list', 'domains_community.list'):
              txt = get(f'https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/main/rules/{fn}')
              if len(txt.splitlines()) > 20:
                  (rules / fn).write_text(txt, encoding='utf-8')

          ru_raw = get('https://www.ipdeny.com/ipblocks/data/countries/ru.zone')
          nets = [ipaddress.ip_network(l.strip()) for l in ru_raw.splitlines() if l.strip()]
          agg = [str(n) for n in ipaddress.collapse_addresses(sorted(nets))]
          if len(agg) > 5000:
              (rules / 'ru_subnets.txt').write_text('\n'.join(agg) + '\n', encoding='utf-8')
          PY

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update routing & RU subnet lists"
            git push
          fi

      - name: Purge jsDelivr CDN cache
        if: always()
        run: |
          for f in bmnd_config.conf rules/domains_banking.list rules/domains_community.list rules/voice_ports.list rules/custom_proxy.list rules/custom_direct.list rules/ru_subnets.txt; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" >/dev/null || true
          done
